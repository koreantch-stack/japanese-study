name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk japanese-study.apk
          gh release delete apk --yes --cleanup-tag || true
          printf 'versionCode=%s\n휴대폰에서 japanese-study.apk 를 내려받아 설치하세요. 사이트를 고치면 앱에도 바로 반영됩니다.\n' "$GITHUB_RUN_NUMBER" > notes.txt
          gh release create apk japanese-study.apk --title "일본어 공부방 APK" --notes-file notes.txt
