plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.koreantch.japanesestudy'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.koreantch.japanesestudy'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore.jks')
            storePassword 'japanese-study'
            keyAlias 'jstudy'
            keyPassword 'japanese-study'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
